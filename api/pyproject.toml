[project]
name = "crm-api"
version = "0.1.0"
description = "Multi-tenant configurable CRM — API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    # Ships the IANA database. Windows has no system tzdata, so without this
    # `ZoneInfo("America/New_York")` raises there — which would make workspace
    # creation reject every timezone, and the M8 scheduler unable to evaluate
    # cron in the workspace's zone.
    "tzdata>=2025.1",
    # The scheduler's cadence is a five-field cron string evaluated in the
    # *workspace's* timezone. Hand-rolling that matcher is a classic source of
    # off-by-one-hour bugs around a DST boundary, which is exactly the failure
    # a customer notices and cannot explain.
    "croniter>=6.0.0",
    # `arq` is the background worker in CLAUDE.md's stack table. M8 is the first
    # milestone that needs a process rather than a function call.
    "arq>=0.26.0",
    # M10 delivers webhooks from the worker. Previously a dev-only dependency
    # for the test client, which would have made the dispatcher an ImportError
    # in production and nowhere else.
    "httpx>=0.28.0",
    # M11 observability. structlog carries the request and workspace ids that
    # make a production error traceable to a tenant; without them a stack trace
    # says what broke and nothing about for whom.
    "structlog>=25.1.0",
    # Both optional at runtime: Sentry needs a DSN and Prometheus needs a
    # scraper, and the app must start cleanly with neither.
    "sentry-sdk[fastapi]>=2.20.0",
    "prometheus-client>=0.21.0",
    "dateparser>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "boto3-stubs[s3]>=1.35.0",
    "types-dateparser>=1.4.3.20260907",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF", # ruff-specific
    "ASYNC",
]
ignore = [
    "B008", # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false      # `Any` is allowed only with a comment (see CLAUDE.md)
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "openpyxl.*", "croniter.*"]
ignore_missing_imports = true

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a real container (Postgres via testcontainers)",
    "performance: seeds the 50k demo workspace and asserts the latency targets",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
